spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  application:
    name: ReconFlow
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      idle-timeout: 10000
      max-lifetime: 30000
  jpa:
    hibernate:
      ddl-auto: update # Automatically apply schema changes
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true
  data:
    redis:
      url: ${REDIS_URL}

aws:
  region: ${AWS_REGION}
  credentials:
    accessKey: ${AWS_ACCESS_KEY_ID}
    secretKey: ${AWS_SECRET_ACCESS_KEY}
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME}
  sqs:
    queue-name: ${AWS_SQS_QUEUE_NAME}
    dlq-name: ${AWS_SQS_DLQ_NAME}
    queue-url: ${AWS_SQS_QUEUE_URL}
    dlq-url: ${AWS_SQS_DLQ_URL}

server:
  port: 8080

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    com.reconflow: DEBUG

jira:
  url: ${JIRA_BASE_URL:https://mock-company.atlassian.net}
  username: ${JIRA_EMAIL:mock.user@company.com}
  api-token: ${JIRA_API_TOKEN:mock_token_123}
  project-key: ${JIRA_PROJECT_KEY:RECON}
